Id":"group-1765891308537","groupTitle":"05-2-この 電車は 甲子園へ 行きますか","groupOrder":9,"speaker":"サントス","voiceName":"Puck","nativePitch":1,"textMode":"DIALOGUE"},{"id":"card-1765901265784-10","original":"どうも。","translation":"谢谢。","groupId":"group-1765891308537","groupTitle":"05-2-この 電車は 甲子園へ 行きますか","groupOrder":10,"speaker":"サントス","voiceName":"Puck","nativePitch":1,"textMode":"DIALOGUE"},{"id":"card-1765901272968-0","original":"先週東京へ行きました。","translation":"A: 我上周去了东京。","groupId":"group-1765891468988","groupTitle":"05-3","groupOrder":0,"speaker":"A","voiceName":"Puck","nativePitch":1,"textMode":"DIALOGUE"},{"id":"card-1765901272968-1","original":"これ、お土産です。","translation":"这是给您的伴手礼。","groupId":"group-1765891468988","groupTitle":"05-3","groupOrder":1,"speaker":"A","voiceName":"Puck","nativePitch":1,"textMode":"DIALOGUE"},{"id":"card-1765901272968-2","original":"どうぞ。","translation":"请收下。","groupId":"group-1765891468988","groupTitle":"05-3","groupOrder":2,"speaker":"A","voiceName":"Puck","nativePitch":1,"textMode":"DIALOGUE"},{"id":"card-1765901272968-3","original":"ありがとう ございます。","translation":"B: 谢谢您。","groupId":"group-1765891468988","groupTitle":"05-3","groupOrder":3,"speaker":"B","voiceName":"Fenrir","nativePitch":1.2,"textMode":"DIALOGUE"},{"id":"card-1765901272968-4","original":"一人で行きましたか。","translation":"您一个人去的吗？","groupId":"group-1765891468988","groupTitle":"05-3","groupOrder":4,"speaker":"B","voiceName":"Fenrir","nativePitch":1.2,"textMode":"DIALOGUE"},{"id":"card-1765901272968-5","original":"いいえ、友達と行きました。","translation":"A: 不，我是和朋友一起去的。","groupId":"group-1765891468988","groupTitle":"05-3","groupOrder":5,"speaker":"A","voiceName":"Puck","nativePitch":1,"textMode":"DIALOGUE"},{"id":"card-1765901272968-6","original":"何で行きましたか。","translation":"B: 您是怎么去的？","groupId":"group-1765891468988","groupTitle":"05-3","groupOrder":6,"speaker":"B","voiceName":"Fenrir","nativePitch":1.2,"textMode":"DIALOGUE"},{"id":"card-1765901272968-7","original":"バスで行きました。","translation":"A: 我是坐巴士去的。","groupId":"group-1765891468988","groupTitle":"05-3","groupOrder":7,"speaker":"A","voiceName":"Puck","nativePitch":1,"textMode":"DIALOGUE"},{"id":"card-1765901279863-0","original":"お国はどちらですか。","translation":"A: 您的国家是哪里？","groupId":"group-1765891523437","groupTitle":"05-4","groupOrder":0,"speaker":"A","voiceName":"Puck","nativePitch":1,"textMode":"DIALOGUE"},{"id":"card-1765901279863-1","original":"アメリカです。","translation":"B: 美国。","groupId":"group-1765891523437","groupTitle":"05-4","groupOrder":1,"speaker":"B","voiceName":"Fenrir","nativePitch":1.2,"textMode":"DIALOGUE"},{"id":"card-1765901279863-2","original":"そうですか。いつ日本へ来ましたか。","translation":"A: 是吗？您是什么时候来日本的？","groupId":"group-1765891523437","groupTitle":"05-4","groupOrder":2,"speaker":"A","voiceName":"Puck","nativePitch":1,"textMode":"DIALOGUE"},{"id":"card-1765901279863-3","original":"去年の9月に来ました。","translation":"B: 去年9月来的。","groupId":"group-1765891523437","groupTitle":"05-4","groupOrder":3,"speaker":"B","voiceName":"Fenrir","nativePitch":1.2,"textMode":"DIALOGUE"}];
    const SETTINGS = { language: 'ja-JP', speed: 1 };

    const Player = () => {
      const [selectedGroupId, setSelectedGroupId] = useState('ALL');
      const [currentIndex, setCurrentIndex] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const [isLoop, setIsLoop] = useState(false);
      const [isSingleLoop, setIsSingleLoop] = useState(false);
      const [isShuffle, setIsShuffle] = useState(false);
      const [speed, setSpeed] = useState(SETTINGS.speed);
      const [voices, setVoices] = useState([]);
      const [showOriginalGlobal, setShowOriginalGlobal] = useState(false);
      const [showTransGlobal, setShowTransGlobal] = useState(false);
      const [showOriginalLocal, setShowOriginalLocal] = useState(false);
      const [showTransLocal, setShowTransLocal] = useState(false);

      const groups = useMemo(() => {
        const uniqueGroups = new Map();
        DATA.forEach(card => {
          if (card.groupId && card.groupTitle) uniqueGroups.set(card.groupId, card.groupTitle);
        });
        return Array.from(uniqueGroups.entries()).map(([id, title]) => ({ id, title }));
      }, []);

      const activeCards = useMemo(() => {
        if (selectedGroupId === 'ALL') return DATA;
        return DATA.filter(c => c.groupId === selectedGroupId);
      }, [selectedGroupId]);

      const playbackQueue = useMemo(() => {
         const indices = activeCards.map((_, i) => i);
         if (indices.length === 0) return [];
         if (!isShuffle) return indices;
         const shuffled = [...indices];
         for (let i = shuffled.length - 1; i > 0; i--) {
             const j = Math.floor(Math.random() * (i + 1));
             [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
         }
         return shuffled;
      }, [activeCards, isShuffle]);

      const card = activeCards[playbackQueue[currentIndex]] || {};

      useEffect(() => {
         const load = () => { 
           try {
             const v = window.speechSynthesis.getVoices(); 
             if(v.length) setVoices(v); 
           } catch(e) {}
         };
         load(); 
         if (window.speechSynthesis.onvoiceschanged !== undefined) {
           window.speechSynthesis.onvoiceschanged = load;
         }
      }, []);

      useEffect(() => {
        setCurrentIndex(0);
        setIsPlaying(false);
        window.speechSynthesis.cancel();
      }, [selectedGroupId, isShuffle]);

      useEffect(() => { 
        setShowOriginalLocal(false);
        setShowTransLocal(false);
        if (isPlaying) speak(); 
      }, [currentIndex]);

      const speak = () => {
         window.speechSynthesis.cancel();
         let rawOriginal = (card.original || "");
         let ttsText = rawOriginal.replace(/<rt\b[^>]*>[\s\S]*?<\/rt>/gi, ''); 
         ttsText = ttsText.replace(/<[^>]+>/g, '').trim(); 
         if(!ttsText) return;
         const u = new SpeechSynthesisUtterance(ttsText);
         u.lang = SETTINGS.language; u.rate = speed; u.pitch = card.nativePitch || 1.25;
         if(voices.length) {
            const langCode = SETTINGS.language.split('-')[0];
            const vList = voices.filter(v => v.lang.startsWith(langCode));
            const femaleKeywords = /female|woman|girl|nanami|kyoko|sayaka|mizuki|mayu|shizuka|haruka|ayumi|siri|samantha|victoria|karen|moira|tessa|veena/i;
            const maleKeywords = /male|man|boy|ichiro|kenji|takumi|daichi|daniel|david/i;
            u.voice = vList.find(v => v.name.match(u.pitch > 1.1 ? femaleKeywords : maleKeywords)) || vList.find(v => v.name.match(femaleKeywords)) || vList[0];
         }
         u.onend = () => {
            if(isSingleLoop) setTimeout(() => speak(), 300);
            else if(isLoop) handleNext(true);
            else setIsPlaying(false);
         };
         window.speechSynthesis.speak(u);
      };

      const handleNext = (auto = false) => {
         if (playbackQueue.length === 0) return;
         setCurrentIndex(c => (c < playbackQueue.length - 1 ? c + 1 : 0));
         setIsPlaying(true);
      };

      const handlePrev = () => {
         if (playbackQueue.length === 0) return;
         setCurrentIndex(c => (c > 0 ? c - 1 : c));
         setIsPlaying(true);
      };

      const isOriginalVisible = showOriginalGlobal || showOriginalLocal;
      const isTransVisible = showTransGlobal || showTransLocal;

      return (
        <div className="max-w-md mx-auto h-full flex flex-col p-4 relative overflow-hidden">
          {/* Header Section - No Animation, Stacked Layout */}
          <div className="flex flex-col items-center gap-3 mb-6 shrink-0 z-50">
            {/* 1. Group Selector (Yellow) */}
            <div className="relative w-full max-w-[280px]">
              <select 
                value={selectedGroupId} 
                onChange={(e) => setSelectedGroupId(e.target.value)}
                className="w-full appearance-none bg-[#FFF9C4] border-4 border-white text-[#D97706] font-black text-center text-base py-3 px-8 rounded-[1.5rem] cursor-pointer shadow-toon outline-none truncate"
              >
                <option value="ALL">All Groups</option>
                {groups.map(g => <option key={g.id} value={g.id}>{g.title}</option>)}
              </select>
              <div className="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-orange-400">
                <Icon name="layers" className="w-5 h-5" />
              </div>
            </div>

            {/* 2. Current Group Name Badge (Green) */}
            <div className="flex justify-center min-h-[44px]">
                {card.groupTitle ? (
                    <div className="bg-[#DCEDC8] px-6 py-2 rounded-full border-4 border-white flex items-center gap-2 shadow-toon">
                        <Icon name="book-open" className="w-4 h-4 text-[#558B2F]" />
                        <span className="text-sm font-black text-[#558B2F] tracking-wide uppercase">{card.groupTitle}</span>
                    </div>
                ) : null}
            </div>

            {/* 3. Index & Speed Control (White) */}
            <div className="flex items-center gap-3 w-full max-w-[300px]">
              <div className="flex-1 bg-white border-4 border-white rounded-full shadow-toon py-3 px-8 flex justify-center items-center">
                 <span className="font-black text-[#E53030] text-3xl tracking-tight">
                   {currentIndex + 1} <span className="text-slate-200 text-base mx-2 italic font-normal">/</span> {playbackQueue.length}
                 </span>
              </div>
              <button 
                onClick={() => { const s = [1.0, 0.8, 0.6]; setSpeed(s[(s.indexOf(speed)+1)%s.length]); }} 
                className="bg-white border-4 border-white text-orange-600 w-16 h-16 rounded-full flex items-center justify-center font-black text-sm shadow-toon shrink-0 active:scale-95 transition-transform"
              >
                {speed}x
              </button>
            </div>
          </div>

          {/* Card Content Section */}
          <div className="flex-1 overflow-y-auto space-y-4 pb-48 no-scrollbar pr-1">
            <div className="piggy-card p-10 flex flex-col items-center justify-center bg-[#FFF9C4]">
              <button 
                onClick={() => { if(isPlaying) { window.speechSynthesis.cancel(); setIsPlaying(false); } else { setIsPlaying(true); speak(); } }} 
                className={"w-28 h-28 rounded-full border-8 border-white shadow-toon bg-[#E53030] flex items-center justify-center transition-all active:scale-95 " + (isPlaying ? "scale-105" : "")}
              >
                {isPlaying ? <Icon name="pause" className="text-white w-12 h-12" /> : <Icon name="play" className="text-white w-12 h-12 ml-2" />}
              </button>
            </div>

            <div 
              onClick={() => setShowOriginalLocal(!showOriginalLocal)} 
              className={"piggy-card p-8 min-h-[140px] bg-[#DCEDC8] flex items-center justify-center cursor-pointer transition-all " + (!isOriginalVisible ? "border-dashed opacity-80" : "border-solid")}
            >
              {isOriginalVisible ? (
                <div className="text-2xl font-black text-[#558B2F] text-center leading-relaxed" dangerouslySetInnerHTML={{__html: card.original}}></div>
              ) : (
                <div className="flex flex-col items-center opacity-40 font-black text-[#558B2F]">
                  <Icon name="eye" className="w-10 h-10 mb-2" />
                  <span className="text-sm">点击显示原文</span>
                </div>
              )}
            </div>

            <div 
              onClick={() => setShowTransLocal(!showTransLocal)} 
              className={"piggy-card p-8 min-h-[120px] bg-[#FFCCBC] flex items-center justify-center cursor-pointer transition-all " + (!isTransVisible ? "border-dashed opacity-80" : "border-solid")}
            >
              {isTransVisible ? (
                <div className="text-xl font-black text-[#BF360C] text-center leading-relaxed">{card.translation}</div>
              ) : (
                <div className="flex flex-col items-center opacity-40 font-black text-[#BF360C]">
                  <Icon name="book-open" className="w-10 h-10 mb-2" />
                  <span className="text-sm">点击显示译文</span>
                </div>
              )}
            </div>
          </div>

          {/* Footer Control Section */}
          <div className="fixed bottom-6 left-4 right-4 z-50">
            <div className="flex justify-center gap-4 mb-4">
               <button onClick={() => setShowOriginalGlobal(!showOriginalGlobal)} className={"px-8 py-2.5 rounded-2xl text-xs font-black border-4 shadow-toon transition-all " + (showOriginalGlobal ? 'bg-[#7FC241] text-white border-white' : 'bg-white text-slate-400 border-white')}>原文</button>
               <button onClick={() => setShowTransGlobal(!showTransGlobal)} className={"px-8 py-2.5 rounded-2xl text-xs font-black border-4 shadow-toon transition-all " + (showTransGlobal ? 'bg-[#FFAEC8] text-white border-white' : 'bg-white text-slate-400 border-white')}>译文</button>
            </div>
            <div className="max-w-md mx-auto flex justify-between items-center gap-2 bg-white/95 p-4 rounded-[2.5rem] border-4 border-white shadow-2xl backdrop-blur-sm">
                <button onClick={handlePrev} className="w-12 h-12 rounded-full bg-[#A2D2FF] text-white flex items-center justify-center border-2 border-white shadow-sm transition-all active:scale-90"><Icon name="skip-back" className="w-6 h-6"/></button>
                <button onClick={() => setIsShuffle(!isShuffle)} className={"w-12 h-12 rounded-2xl border-4 transition-all flex items-center justify-center " + (isShuffle ? 'bg-[#F9E05E] border-white text-[#D97706] shadow-sm' : 'bg-slate-100 border-white text-slate-400')}><Icon name="shuffle" className="w-6 h-6"/></button>
                <button onClick={() => { setIsSingleLoop(!isSingleLoop); if(!isSingleLoop) setIsLoop(false); }} className={"w-12 h-12 rounded-2xl border-4 transition-all flex items-center justify-center " + (isSingleLoop ? 'bg-orange-500 border-white text-white shadow-sm' : 'bg-slate-100 border-white text-slate-400')}><Icon name="repeat-1" className="w-6 h-6"/></button>
                <button onClick={() => { setIsLoop(!isLoop); if(!isLoop) setIsSingleLoop(false); }} className={"w-12 h-12 rounded-2xl border-4 transition-all flex items-center justify-center " + (isLoop ? 'bg-[#7FC241] border-white text-white shadow-sm' : 'bg-slate-100 border-white text-slate-400')}><Icon name="infinity" className="w-6 h-6"/></button>
                <button onClick={() => handleNext(false)} className="w-12 h-12 rounded-full bg-[#E53030] text-white flex items-center justify-center border-2 border-white shadow-sm transition-all active:scale-90"><Icon name="skip-forward" className="w-6 h-6"/></button>
            </div>
          </div>
        </div>
      );
    };
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<Player />);
  </script>
</body>
</html>
